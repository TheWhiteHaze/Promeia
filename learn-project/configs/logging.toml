version = 1

[loggers.root]
level = "INFO"
handlers = ["console", "file"]

[handlers.console]
class = "logging.StreamHandler"
level = "DEBUG"
formatter = "standard"
stream = "ext://sys.stdout"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "INFO"
formatter = "standard"
filename = "logs/app.log"
maxBytes = 10485760
backupCount = 5
encoding = "utf-8"

[formatters.standard]
format = "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"